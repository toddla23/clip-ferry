# 단일 릴레이 노드. 실행: docker compose -f deploy/compose.yml up -d --build
# 디스크에 쓰는 것이 없으므로 루트 파일시스템을 읽기 전용으로 둔다.
services:
  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: clip-ferry-relay:local
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # 기본은 이 기기에서만 접속. Tailscale로 열려면 CF_BIND에 Tailscale IP를 넣는다 (예: 100.x.x.x).
    ports:
      - "${CF_BIND:-127.0.0.1}:8787:8787"
    environment:
      # 리버스 프록시(tailscale serve 등) 뒤에서만 true. 포트가 127.0.0.1에만 열려 있을 때 쓴다.
      CF_RELAY_TRUST_PROXY: "${CF_TRUST_PROXY:-false}"
