[package]
name = "clip-ferry-cli"
description = "clip-ferry 개발·검증용 CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "cf"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
clip-ferry-core = { path = "../../core" }
qrcode = { version = "0.14", default-features = false }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "io-std", "io-util", "time"] }

[dev-dependencies]
tempfile = "3"
