[package]
name = "clip-ferry-desktop"
description = "clip-ferry 데스크톱 셸 (Tauri)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clip-ferry-core = { path = "../../../core" }
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = { version = "0.14", default-features = false }
# 플랫폼 보안 저장소: Windows Credential Manager / macOS Keychain / Linux keyutils
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }

[dev-dependencies]
tempfile = "3"
