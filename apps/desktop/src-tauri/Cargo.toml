[package]
name = "clip-ferry-desktop"
description = "clip-ferry 데스크톱 셸 (Tauri)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clip-ferry-core = { path = "../../../core" }
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 플랫폼 보안 저장소: Windows Credential Manager / macOS Keychain / Linux keyutils
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }

tokio = { workspace = true, features = ["time", "net", "io-util", "sync", "macros"] }
# 계정 서버 호출 (F34)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# 구글 로그인 PKCE (F34)
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
# 클립보드 텍스트·이미지 읽기·쓰기
arboard = { version = "3", default-features = false, features = ["image-data"] }
# 이미지 인코딩(PNG)·디코딩(PNG·JPEG·GIF·WebP). 필요한 형식만 켠다.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# 크기 초과 같은 안내를 시스템 알림으로 띄운다.
tauri-plugin-notification = "2"
# 로그인 시 자동 시작 (Windows 레지스트리 / macOS LaunchAgent)
tauri-plugin-autostart = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    # 시작할 때 로컬 상태를 못 열면 묻는 창 (F44)
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSString"] }

[dev-dependencies]
tempfile = "3"
# 실제 계정 서버(메모리 저장소)로 로그인·갱신·로그아웃을 시험한다
clip-ferry-account = { path = "../../../account" }
axum = "0.7"
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util"] }
