[package]
name = "clip-ferry-desktop"
description = "clip-ferry 데스크톱 셸 (Tauri)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clip-ferry-core = { path = "../../../core" }
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = { version = "0.14", default-features = false }
# 플랫폼 보안 저장소: Windows Credential Manager / macOS Keychain / Linux keyutils
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }

tokio = { workspace = true, features = ["time"] }
# 클립보드 텍스트 읽기·쓰기 (이미지는 F12에서 기능을 추가한다)
arboard = { version = "3", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSString"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util"] }
