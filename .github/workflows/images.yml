# 서버 이미지(릴레이·계정 서버)를 빌드해 GHCR에 올린다 (F40, D-025).
# 클라우드 VM은 메모리가 작아 직접 빌드하지 않고 여기서 받은 이미지를 쓴다(deploy/compose.cloud.yml).
# 태그: main → `main`, 브랜치 → 브랜치 이름, v* 태그 → 버전, 모든 실행 → `sha-<짧은 커밋>`.
name: Images

on:
  push:
    # 기능 브랜치(f40-…, f43-…)도 올려 머지 전에 서버에서 시험한다
    branches: [main, "f[0-9]*"]
    tags: ["v*"]
    paths:
      - "core/**"
      - "relay/**"
      - "account/**"
      - "proto/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deploy/Dockerfile"
      - "deploy/Dockerfile.account"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: relay
            dockerfile: deploy/Dockerfile
          - name: account
            dockerfile: deploy/Dockerfile.account
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/clip-ferry-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # VM(Azure B2ts v2)이 x64다. Pi(arm64)는 지금처럼 Pi에서 직접 빌드한다.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
