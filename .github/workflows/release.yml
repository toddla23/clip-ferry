# 배포 파일을 만들어 GitHub Releases에 올린다 (docs/07-release.md).
#   - v로 시작하는 태그를 푸시하면 (예: v0.1.0) 그 태그의 릴리스를 만든다.
#   - Actions 화면에서 직접 실행하면(workflow_dispatch) 릴리스 없이 빌드만 하고 산출물(artifact)로 남긴다.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ""
            files: target/release/bundle/nsis/*.exe
          - name: macos
            os: macos-latest
            # Intel·Apple Silicon 둘 다 도는 유니버설 앱
            args: --target universal-apple-darwin
            files: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: linux
            # 오래된 glibc에서 만들어야 더 많은 배포판에서 AppImage가 돈다.
            os: ubuntu-22.04
            args: ""
            files: |
              target/release/bundle/deb/*.deb
              target/release/bundle/appimage/*.AppImage
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (rust-toolchain.toml)
        run: rustup show
      - name: macOS 유니버설 타깃
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: 데스크톱(Tauri) 빌드 의존성 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: Swatinem/rust-cache@v2
      - name: 앱 버전을 태그에 맞춘다
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          node -e '
            const fs = require("fs");
            const p = "apps/desktop/src-tauri/tauri.conf.json";
            const c = JSON.parse(fs.readFileSync(p, "utf8"));
            c.version = process.argv[1];
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
          ' "$version"
      - name: 빌드·묶기
        working-directory: apps/desktop
        shell: bash
        run: |
          npm ci
          npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
      - name: 릴리스에 올리기
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # v0.2.0-rc1 처럼 '-'가 붙은 태그는 시험판(pre-release)으로 올린다.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: ${{ matrix.files }}

  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup show
          rustup target add aarch64-linux-android x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: Swatinem/rust-cache@v2
      - name: cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: 코어(.so)와 Kotlin 바인딩
        run: |
          # 러너 이미지의 NDK 경로는 ${{ env.* }}로 읽히지 않으므로 쉘에서 고른다.
          # ANDROID_NDK_LATEST_HOME → ANDROID_NDK_HOME → $ANDROID_HOME/ndk 아래 최신 순.
          ndk="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$ndk" ] && [ -d "${ANDROID_HOME:-}/ndk" ]; then
            ndk=$(ls -d "$ANDROID_HOME"/ndk/*/ | sort -V | tail -1)
          fi
          if [ -z "$ndk" ]; then
            echo "::error::러너에서 Android NDK를 찾지 못했습니다"
            exit 1
          fi
          export ANDROID_NDK_HOME="${ndk%/}"
          echo "NDK: $ANDROID_NDK_HOME"
          set +e
          ./scripts/build-android-core.sh > core.log 2>&1
          status=$?
          cat core.log
          if [ $status -ne 0 ]; then
            # 로그 원문은 로그인해야 보이므로 오류 줄과 마지막 줄을 주석으로 남긴다.
            grep -E 'error|Error|unbound|No such|not found' core.log | tail -15 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -5 core.log | while IFS= read -r line; do echo "::error::(tail) $line"; done
          fi
          exit $status
      - name: 서명 키 풀기
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::저장소 Secrets에 ANDROID_KEYSTORE_BASE64가 없습니다 (docs/07-release.md 2절)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: APK 빌드 (assembleRelease)
        working-directory: apps/android
        env:
          CLIPFERRY_KEYSTORE: ${{ runner.temp }}/release.jks
          CLIPFERRY_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CLIPFERRY_VERSION_CODE: ${{ github.run_number }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export CLIPFERRY_VERSION_NAME="${GITHUB_REF_NAME#v}"
          fi
          set +e
          ./gradlew assembleRelease --console=plain > gradle.log 2>&1
          status=$?
          cat gradle.log
          if [ $status -ne 0 ]; then
            grep -E 'error|Error|FAILED|What went wrong' -A2 gradle.log | grep -v '^--$' | tail -15 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit $status
          fi
          set -e
          name="clip-ferry-${CLIPFERRY_VERSION_NAME:-dev}-android.apk"
          mv app/build/outputs/apk/release/app-release.apk "../../$name"
          echo "APK=$name" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ env.APK }}
          if-no-files-found: error
      - name: 릴리스에 올리기
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # v0.2.0-rc1 처럼 '-'가 붙은 태그는 시험판(pre-release)으로 올린다.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: ${{ env.APK }}
